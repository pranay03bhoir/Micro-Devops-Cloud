apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blogapp-hpa

spec:
  scaleTargetRef:
    apiVersion: app/v1
    kind: Deployment
    name: blogapp-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
