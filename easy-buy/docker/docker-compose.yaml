services:
  mysql:
    image: mysql:latest
    container_name: mysql-container-new
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: pranay123
      MYSQL_DATABASE: initial_db

    volumes:
      - mysql_data_new:/var/lib/mysql
    networks:
      - backend_network_new

volumes:
  mysql_data_new:
    driver: local

networks:
  backend_network_new:
    driver: bridge
