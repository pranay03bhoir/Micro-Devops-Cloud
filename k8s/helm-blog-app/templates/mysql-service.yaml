{{- if .Values.mysql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stateful-blog.fullname" . }}-mysql
  labels: {{- include "stateful-blog.labels" . | nindent 4 }}

spec:
  clusterIP: None
  selector:
    app: mysql

  ports:
    - protocol: TCP
      port: {{ .Values.mysql.service.port }}
      targetPort: {{ .Values.mysql.service.targetPort }}
    # ClusterIP is used to access within the cluster.
  #type: ClusterIP
  type: ClusterIP
{{- end -}}